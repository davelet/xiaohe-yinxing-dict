[package]
name = "xiaohe-yinxing-dict"
version = "0.7.2"
edition = "2024"

[[bin]]
name = "xiaohe-yinxing-dict"
path = "src/main.rs"

[[bin]]
name = "updater"
path = "src/bin/updater.rs"

[dependencies]
eframe = "0.34.3"
image = { version = "0.25", features = ["webp"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"
zip = "2"
sha2 = "0.10"

[build-dependencies]
winres = "0.1"

[package.metadata.bundle]
name = "小鹤音形词典"
identifier = "com.xiaohe.yinxing-dict"
icon = ["AppIcon.icns"]
category = "Education"
