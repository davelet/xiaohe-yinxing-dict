[package]
name = "xiaohe-yinxing-dict"
version = "0.6.1"
edition = "2024"

[dependencies]
eframe = "0.34.3"
image = { version = "0.25", features = ["webp"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"

[build-dependencies]
winres = "0.1"

[package.metadata.bundle]
name = "小鹤音形词典"
identifier = "com.xiaohe.yinxing-dict"
icon = ["AppIcon.icns"]
category = "Education"
