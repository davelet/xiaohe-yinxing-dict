name: Build & Release

# 仅在推送 v* 标签时触发
on:
  push:
    tags: ["v*"]

# tag push 不允许被取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APP_NAME: xiaohe-yinxing-dict
  APP_BUNDLE_ID: com.xiaohe.yinxing-dict
  DMG_VOLNAME: 小鹤音形词典

jobs:
  # ---------------------------------------------------------------
  # 1. Lint & Test — PR / push 阶段跑，tag 不跑（避免重复）
  # ---------------------------------------------------------------
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Test
        run: cargo test --locked

  # ---------------------------------------------------------------
  # 2. macOS Build
  # ---------------------------------------------------------------
  build-macos:
    name: Build macOS
    needs: lint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Add Rust targets (x86_64 + aarch64)
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build for x86_64 (Intel)
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Build for aarch64 (Apple Silicon)
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Strip x86_64 binary
        run: strip -x target/x86_64-apple-darwin/release/${APP_NAME}

      - name: Strip aarch64 binary
        run: strip -x target/aarch64-apple-darwin/release/${APP_NAME}

      - name: Get version from Cargo.toml
        id: get_version
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version =/ {print $2; exit}' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to parse version from Cargo.toml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify tag version matches Cargo.toml
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$APP_VERSION" ]; then
            echo "::error::Tag version (v$TAG) does not match Cargo.toml version ($APP_VERSION)"
            echo "::error::Bump version in Cargo.toml or fix the tag."
            exit 1
          fi
          echo "Tag v$TAG matches Cargo.toml version $APP_VERSION"

      # ---- 图标准备：静态文件，与运行时图标由相同算法生成 ----
      - name: Copy AppIcon.icns
        run: cp assets/AppIcon.icns AppIcon.icns

      - name: Create x86_64 .app bundle
        run: |
          set -euo pipefail
          APP_DIR="target/x86_64-apple-darwin/release/${DMG_VOLNAME}.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "target/x86_64-apple-darwin/release/${APP_NAME}" "$APP_DIR/Contents/MacOS/"
          [ -f AppIcon.icns ] && cp AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>${APP_BUNDLE_ID}</string>
              <key>CFBundleName</key>
              <string>${DMG_VOLNAME}</string>
              <key>CFBundleDisplayName</key>
              <string>${DMG_VOLNAME}</string>
              <key>CFBundleVersion</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          EOF

      - name: Create aarch64 .app bundle
        run: |
          set -euo pipefail
          APP_DIR="target/aarch64-apple-darwin/release/${DMG_VOLNAME}.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "target/aarch64-apple-darwin/release/${APP_NAME}" "$APP_DIR/Contents/MacOS/"
          [ -f AppIcon.icns ] && cp AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"
          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>${APP_BUNDLE_ID}</string>
              <key>CFBundleName</key>
              <string>${DMG_VOLNAME}</string>
              <key>CFBundleDisplayName</key>
              <string>${DMG_VOLNAME}</string>
              <key>CFBundleVersion</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIconName</key>
              <string>AppIcon</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          EOF

      # ---- 可选：Apple Developer ID 代码签名 + 公证 ----
      - name: Import signing certificate
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Certificate imported"

      - name: Code sign both apps
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for arch in x86_64-apple-darwin aarch64-apple-darwin; do
            APP="target/$arch/release/${DMG_VOLNAME}.app"
            codesign --deep --force --options runtime --timestamp \
              --sign "Developer ID Application: ${APPLE_TEAM_ID}" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          done

      - name: Notarize and staple both apps
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for arch in x86_64-apple-darwin aarch64-apple-darwin; do
            APP="target/$arch/release/${DMG_VOLNAME}.app"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "${APP}.zip"
            xcrun notarytool submit "${APP}.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$APP"
          done

      - name: Create x86_64 DMG
        run: |
          set -euo pipefail
          STAGING="target/x86_64-apple-darwin/release/dmg_staging"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R "target/x86_64-apple-darwin/release/${DMG_VOLNAME}.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "${DMG_VOLNAME} (Intel)" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "target/x86_64-apple-darwin/release/${DMG_VOLNAME}-macos-x86_64.dmg"

      - name: Create aarch64 DMG
        run: |
          set -euo pipefail
          STAGING="target/aarch64-apple-darwin/release/dmg_staging"
          rm -rf "$STAGING" && mkdir -p "$STAGING"
          cp -R "target/aarch64-apple-darwin/release/${DMG_VOLNAME}.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "${DMG_VOLNAME} (Apple Silicon)" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "target/aarch64-apple-darwin/release/${DMG_VOLNAME}-macos-aarch64.dmg"

      - name: Create x86_64 zip (for auto-update)
        run: |
          set -euo pipefail
          ZIP="target/x86_64-apple-darwin/release/${DMG_VOLNAME}-macos-x86_64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "target/x86_64-apple-darwin/release/${DMG_VOLNAME}.app" "$ZIP"
          shasum -a 256 "$ZIP" | awk '{print $1}' > "${ZIP}.sha256"

      - name: Create aarch64 zip (for auto-update)
        run: |
          set -euo pipefail
          ZIP="target/aarch64-apple-darwin/release/${DMG_VOLNAME}-macos-aarch64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "target/aarch64-apple-darwin/release/${DMG_VOLNAME}.app" "$ZIP"
          shasum -a 256 "$ZIP" | awk '{print $1}' > "${ZIP}.sha256"

      - name: Upload x86_64 DMG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xiaohe-yinxing-dict-macos-x86_64
          path: target/x86_64-apple-darwin/release/${{ env.DMG_VOLNAME }}-macos-x86_64.dmg
          if-no-files-found: error

      - name: Upload aarch64 DMG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xiaohe-yinxing-dict-macos-aarch64
          path: target/aarch64-apple-darwin/release/${{ env.DMG_VOLNAME }}-macos-aarch64.dmg
          if-no-files-found: error

      - name: Upload x86_64 zip (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xiaohe-yinxing-dict-macos-x86_64-zip
          path: |
            target/x86_64-apple-darwin/release/${{ env.DMG_VOLNAME }}-macos-x86_64.zip
            target/x86_64-apple-darwin/release/${{ env.DMG_VOLNAME }}-macos-x86_64.zip.sha256
          if-no-files-found: error

      - name: Upload aarch64 zip (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xiaohe-yinxing-dict-macos-aarch64-zip
          path: |
            target/aarch64-apple-darwin/release/${{ env.DMG_VOLNAME }}-macos-aarch64.zip
            target/aarch64-apple-darwin/release/${{ env.DMG_VOLNAME }}-macos-aarch64.zip.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 3. Windows Build — push 阶段跑，PR 跳过
  # ---------------------------------------------------------------
  build-windows:
    name: Build Windows
    needs: lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2

      - name: Build (Release)
        run: cargo build --release --locked

      - name: Package Windows (zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = "target/release/小鹤音形词典-windows"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "target/release/xiaohe-yinxing-dict.exe" "$dst/小鹤音形词典.exe"
          if (Test-Path "target/release/updater.exe") {
            Copy-Item "target/release/updater.exe" "$dst/updater.exe"
          }
          if (Test-Path README.md) { Copy-Item README.md "$dst/README.txt" }
          $zip = "target/release/小鹤音形词典-windows.zip"
          Compress-Archive -Path $dst -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Set-Content -Path "${zip}.sha256" -Value $hash
          Get-ChildItem $zip, "${zip}.sha256"

      - name: Upload zip (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xiaohe-yinxing-dict-windows
          path: |
            target/release/小鹤音形词典-windows.zip
            target/release/小鹤音形词典-windows.zip.sha256
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 4. Release — 仅在 tag 触发时跑（当前唯一触发器）
  # ---------------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | head -n 2 | tail -n 1)

          {
            echo "## 更新内容"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG...$TAG" --pretty=format:"* %s" --no-merges
            else
              git log --pretty=format:"* %s" --no-merges
            fi
          } > "${{ runner.temp }}/release_notes.md"

      - name: Download macOS x86_64 DMG
        uses: actions/download-artifact@v4
        with:
          name: xiaohe-yinxing-dict-macos-x86_64
          path: artifacts

      - name: Download macOS aarch64 DMG
        uses: actions/download-artifact@v4
        with:
          name: xiaohe-yinxing-dict-macos-aarch64
          path: artifacts

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: xiaohe-yinxing-dict-windows
          path: artifacts

      - name: Download macOS x86_64 zip
        uses: actions/download-artifact@v4
        with:
          name: xiaohe-yinxing-dict-macos-x86_64-zip
          path: artifacts

      - name: Download macOS aarch64 zip
        uses: actions/download-artifact@v4
        with:
          name: xiaohe-yinxing-dict-macos-aarch64-zip
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "小鹤音形词典 ${{ github.ref_name }}"
          body_path: ${{ runner.temp }}/release_notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/${{ env.DMG_VOLNAME }}-macos-x86_64.dmg
            artifacts/${{ env.DMG_VOLNAME }}-macos-aarch64.dmg
            artifacts/${{ env.DMG_VOLNAME }}-macos-x86_64.zip
            artifacts/${{ env.DMG_VOLNAME }}-macos-x86_64.zip.sha256
            artifacts/${{ env.DMG_VOLNAME }}-macos-aarch64.zip
            artifacts/${{ env.DMG_VOLNAME }}-macos-aarch64.zip.sha256
            artifacts/小鹤音形词典-windows.zip
            artifacts/小鹤音形词典-windows.zip.sha256
